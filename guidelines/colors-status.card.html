<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-body)}.g{display:grid;gap:10px}.lbl{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--md-ink-soft);margin-top:6px}.hex{font-family:var(--font-mono);font-size:9.5px;color:var(--text-source);letter-spacing:.03em}.sw{height:64px;border-radius:10px;border:1px solid var(--md-line)}</style></head><body><div class="g" style="grid-template-columns:repeat(3,1fr)">
<div><div class="sw" style="background:var(--md-green)"></div><div class="lbl">Green</div><div class="hex">--md-green<br>#1BB98A</div></div>
<div><div class="sw" style="background:var(--md-green-dark)"></div><div class="lbl">Green dark (text)</div><div class="hex">--md-green-dark<br>#157A5C</div></div>
<div><div class="sw" style="background:var(--md-green-tint)"></div><div class="lbl">Green tint</div><div class="hex">--md-green-tint<br>#E3F6EE</div></div>
</div>
<div style="display:flex;gap:14px;align-items:center;margin-top:16px">
<span style="display:inline-flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:13px;color:var(--md-blue-dark);background:var(--md-blue-tint-2);border:1px solid var(--md-blue-border-strong);border-radius:99px;padding:8px 17px"><span style="width:9px;height:9px;border-radius:50%;background:var(--md-green);animation:mdpulse 2s infinite"></span>Live in 24 hours</span>
<span style="font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--md-green-dark);background:var(--md-green-tint);border-radius:99px;padding:3px 9px;font-weight:700">✓ Generated</span>
<span class="hex">These two states are the only sanctioned uses.</span>
</div></body></html>
