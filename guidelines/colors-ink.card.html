<!-- @dsCard group="Colors" viewport="700x230" name="Ink & neutrals" subtitle="Charcoal headline ink down to faint mono citations" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-body)}.g{display:grid;gap:10px}.lbl{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--md-ink-soft);margin-top:6px}.hex{font-family:var(--font-mono);font-size:9.5px;color:var(--text-source);letter-spacing:.03em}.sw{height:64px;border-radius:10px;border:1px solid var(--md-line)}</style></head><body><div class="g" style="grid-template-columns:repeat(4,1fr)">
<div><div class="sw" style="background:var(--md-ink)"></div><div class="lbl">Ink (strong)</div><div class="hex">--md-ink<br>#1E1E1E</div></div>
<div><div class="sw" style="background:var(--md-ink-display)"></div><div class="lbl">Ink display</div><div class="hex">--md-ink-display<br>#343633</div></div>
<div><div class="sw" style="background:var(--md-ink-body)"></div><div class="lbl">Ink body</div><div class="hex">--md-ink-body<br>#363636</div></div>
<div><div class="sw" style="background:var(--md-ink-muted)"></div><div class="lbl">Ink muted</div><div class="hex">--md-ink-muted<br>#5D5D5D</div></div>
<div><div class="sw" style="background:var(--md-ink-soft)"></div><div class="lbl">Ink soft</div><div class="hex">--md-ink-soft<br>#8A8A8A</div></div>
<div><div class="sw" style="background:var(--md-ink-faint)"></div><div class="lbl">Ink faint</div><div class="hex">--md-ink-faint<br>#A0A0A0</div></div>
<div><div class="sw" style="background:var(--md-slate)"></div><div class="lbl">Slate</div><div class="hex">--md-slate<br>#4A5560</div></div>
<div><div class="sw" style="background:var(--md-slate-soft)"></div><div class="lbl">Slate soft</div><div class="hex">--md-slate-soft<br>#8A96A2</div></div>
</div></body></html>
