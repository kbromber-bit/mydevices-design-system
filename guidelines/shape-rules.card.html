<!-- @dsCard group="Shape" viewport="700x220" name="Borders & rules" subtitle="1px #E6E8EB, 3px blue quote rule, 3px category rule, dashed placeholder" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-body)}.g{display:grid;gap:10px}.lbl{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--md-ink-soft);margin-top:6px}.hex{font-family:var(--font-mono);font-size:9.5px;color:var(--text-source);letter-spacing:.03em}.sw{height:64px;border-radius:10px;border:1px solid var(--md-line)}</style></head><body><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:18px">
<div style="border:1px solid var(--md-line);border-radius:12px;padding:14px;font-size:13px;color:var(--md-ink-muted)">1px solid --md-line · the default card border</div>
<div style="border:1px solid var(--md-line);border-top:3px solid var(--md-cat-energy);border-radius:12px;padding:14px;font-size:13px;color:var(--md-ink-muted)">3px category top-rule</div>
<div style="border-left:3px solid var(--md-blue);padding:4px 0 4px 16px;font-size:15px;font-style:italic;color:#3a3a3a">3px blue rule on every quote</div>
<div style="display:flex;align-items:center;gap:12px"><div style="width:46px;height:46px;border-radius:50%;border:2px dashed var(--md-line-dashed);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:9px;color:var(--md-slate-soft)">▢</div><span class="hex">2px dashed --md-line-dashed<br>honest placeholder</span></div>
</div></body></html>
