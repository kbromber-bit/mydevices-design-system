<!-- @dsCard group="Colors" viewport="700x190" name="Surfaces & lines" subtitle="White, pale grey band, card chrome, the 1px border" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-body)}.g{display:grid;gap:10px}.lbl{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--md-ink-soft);margin-top:6px}.hex{font-family:var(--font-mono);font-size:9.5px;color:var(--text-source);letter-spacing:.03em}.sw{height:64px;border-radius:10px;border:1px solid var(--md-line)}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)">
<div><div class="sw" style="background:var(--md-white)"></div><div class="lbl">Page white</div><div class="hex">--md-white<br>#FFFFFF</div></div>
<div><div class="sw" style="background:var(--md-off-white)"></div><div class="lbl">Alt band</div><div class="hex">--md-off-white<br>#F7F7F7</div></div>
<div><div class="sw" style="background:var(--md-surface-raised)"></div><div class="lbl">Card chrome</div><div class="hex">--md-surface-raised<br>#FBFCFD</div></div>
<div><div class="sw" style="background:var(--md-line)"></div><div class="lbl">Border</div><div class="hex">--md-line<br>#E6E8EB</div></div>
<div><div class="sw" style="background:var(--md-line-soft)"></div><div class="lbl">Inner divider</div><div class="hex">--md-line-soft<br>#EEF1F4</div></div>
</div></body></html>
