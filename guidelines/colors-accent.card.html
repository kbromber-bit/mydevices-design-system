<!-- @dsCard group="Colors" viewport="700x190" name="Accent blue" subtitle="One accent does every CTA, link and emphasis" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-body)}.g{display:grid;gap:10px}.lbl{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--md-ink-soft);margin-top:6px}.hex{font-family:var(--font-mono);font-size:9.5px;color:var(--text-source);letter-spacing:.03em}.sw{height:64px;border-radius:10px;border:1px solid var(--md-line)}</style></head><body><div class="g" style="grid-template-columns:repeat(4,1fr)">
<div><div class="sw" style="background:var(--md-blue)"></div><div class="lbl">Blue (accent)</div><div class="hex">--md-blue<br>#0D83D0</div></div>
<div><div class="sw" style="background:var(--md-blue-dark)"></div><div class="lbl">Blue dark (hover)</div><div class="hex">--md-blue-dark<br>#0A6AA8</div></div>
<div><div class="sw" style="background:var(--md-blue-light)"></div><div class="lbl">Blue light (on navy only)</div><div class="hex">--md-blue-light<br>#56B0EA</div></div>
<div><div class="sw" style="background:var(--md-blue-2b)"></div><div class="lbl">Blue 2B (rule hue)</div><div class="hex">--md-blue-2b<br>#2B8FD0</div></div>
</div></body></html>
