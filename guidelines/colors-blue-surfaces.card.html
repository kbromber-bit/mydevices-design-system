<!-- @dsCard group="Colors" viewport="700x190" name="Blue surfaces & borders" subtitle="Pale blue tints for callouts, badges and chip fills" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-body)}.g{display:grid;gap:10px}.lbl{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--md-ink-soft);margin-top:6px}.hex{font-family:var(--font-mono);font-size:9.5px;color:var(--text-source);letter-spacing:.03em}.sw{height:64px;border-radius:10px;border:1px solid var(--md-line)}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)">
<div><div class="sw" style="background:var(--md-blue-tint)"></div><div class="lbl">Tint</div><div class="hex">--md-blue-tint<br>#F3F9FE</div></div>
<div><div class="sw" style="background:var(--md-blue-tint-2)"></div><div class="lbl">Tint 2</div><div class="hex">--md-blue-tint-2<br>#E8F4FC</div></div>
<div><div class="sw" style="background:var(--md-blue-border)"></div><div class="lbl">Border</div><div class="hex">--md-blue-border<br>#DCECF8</div></div>
<div><div class="sw" style="background:var(--md-blue-border-soft)"></div><div class="lbl">Border soft</div><div class="hex">--md-blue-border-soft<br>#CFE4F5</div></div>
<div><div class="sw" style="background:var(--md-blue-border-strong)"></div><div class="lbl">Border strong</div><div class="hex">--md-blue-border-strong<br>#BFE0F4</div></div>
</div></body></html>
