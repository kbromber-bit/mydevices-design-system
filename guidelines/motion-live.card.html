<!-- @dsCard group="Motion" viewport="700x210" name="Live & enter animations" subtitle="mdpulse for live status · mdrise for arriving content · spin for work in progress" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-body)}.g{display:grid;gap:10px}.lbl{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--md-ink-soft);margin-top:6px}.hex{font-family:var(--font-mono);font-size:9.5px;color:var(--text-source);letter-spacing:.03em}.sw{height:64px;border-radius:10px;border:1px solid var(--md-line)}</style></head><body><div style="display:flex;gap:26px;align-items:center;flex-wrap:wrap">
<span style="display:inline-flex;align-items:center;gap:9px;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--md-green-dark)"><span style="width:9px;height:9px;border-radius:50%;background:var(--md-green);animation:mdpulse 2s infinite"></span>mdpulse</span>
<span style="display:inline-flex;align-items:center;gap:9px;font-family:var(--font-mono);font-size:11px;color:var(--md-ink-muted)"><span style="display:inline-block;width:13px;height:13px;border:2px solid #cfe0ee;border-top-color:var(--md-blue);border-radius:50%;animation:spin .8s linear infinite"></span>spin · working</span>
<span style="font-family:var(--font-mono);font-size:11px;color:var(--md-ink-muted);animation:mdrise 1.4s ease infinite alternate">mdrise · content arriving</span>
<span style="font-family:var(--font-mono);font-size:11px;color:var(--md-ink-muted);animation:mdfade 1.4s ease infinite alternate">mdfade · artifact page swap</span>
</div>
<div class="hex" style="margin-top:16px;line-height:1.6">Keyframes ship in tokens/motion.css: mdpulse, mdrise, mdpop, mdfade, mdgrow, mdflow, mdsignal, mdglow, mdcell, spin.<br>Animation only ever signals real state: live, working, arriving. Nothing animates for decoration.</div></body></html>
