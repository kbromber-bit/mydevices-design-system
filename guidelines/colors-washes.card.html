<!-- @dsCard group="Colors" viewport="700x210" name="Background washes" subtitle="Radial blue washes top and bottom; hatch = honest placeholder" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-body)}.g{display:grid;gap:10px}.lbl{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--md-ink-soft);margin-top:6px}.hex{font-family:var(--font-mono);font-size:9.5px;color:var(--text-source);letter-spacing:.03em}.sw{height:64px;border-radius:10px;border:1px solid var(--md-line)}</style></head><body><div class="g" style="grid-template-columns:repeat(3,1fr)">
<div><div class="sw" style="height:110px;background:var(--wash-hero)"></div><div class="lbl">Hero wash</div><div class="hex">--wash-hero</div></div>
<div><div class="sw" style="height:110px;background:var(--wash-cta)"></div><div class="lbl">CTA wash</div><div class="hex">--wash-cta</div></div>
<div><div class="sw" style="height:110px;background:var(--wash-placeholder)"></div><div class="lbl">Placeholder hatch</div><div class="hex">--wash-placeholder</div></div>
</div></body></html>
