<!-- @dsCard group="Shape" viewport="700x260" name="Blue-tinted glows" subtitle="No grey drop shadows anywhere — shadows are blue light" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-body)}.g{display:grid;gap:10px}.lbl{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--md-ink-soft);margin-top:6px}.hex{font-family:var(--font-mono);font-size:9.5px;color:var(--text-source);letter-spacing:.03em}.sw{height:64px;border-radius:10px;border:1px solid var(--md-line)}</style></head><body><div class="g" style="grid-template-columns:repeat(3,1fr);gap:24px">
<div><div style="height:56px;background:#fff;border:1px solid var(--md-line);border-radius:12px;box-shadow:var(--glow-btn)"></div><div class="lbl">Button</div><div class="hex">--glow-btn</div></div><div><div style="height:56px;background:#fff;border:1px solid var(--md-line);border-radius:12px;box-shadow:var(--glow-btn-hover)"></div><div class="lbl">Button hover</div><div class="hex">--glow-btn-hover</div></div><div><div style="height:56px;background:#fff;border:1px solid var(--md-line);border-radius:12px;box-shadow:var(--glow-card)"></div><div class="lbl">Card hover</div><div class="hex">--glow-card</div></div><div><div style="height:56px;background:#fff;border:1px solid var(--md-line);border-radius:12px;box-shadow:var(--glow-panel)"></div><div class="lbl">Panel</div><div class="hex">--glow-panel</div></div><div><div style="height:56px;background:#fff;border:1px solid var(--md-line);border-radius:12px;box-shadow:var(--glow-panel-lg)"></div><div class="lbl">Panel lg</div><div class="hex">--glow-panel-lg</div></div><div><div style="height:56px;background:#fff;border:1px solid var(--md-line);border-radius:12px;box-shadow:var(--glow-navy)"></div><div class="lbl">Navy</div><div class="hex">--glow-navy</div></div>
</div></body></html>
