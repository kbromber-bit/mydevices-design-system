<!-- @dsCard group="Colors" viewport="700x210" name="Navy — the one dark section" subtitle="Exactly one navy band per page, for gravity" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff;font-family:var(--font-body)}.g{display:grid;gap:10px}.lbl{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--md-ink-soft);margin-top:6px}.hex{font-family:var(--font-mono);font-size:9.5px;color:var(--text-source);letter-spacing:.03em}.sw{height:64px;border-radius:10px;border:1px solid var(--md-line)}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)">
<div><div class="sw" style="background:var(--md-navy)"></div><div class="lbl">Navy</div><div class="hex">--md-navy<br>#0B2436</div></div>
<div><div class="sw" style="background:var(--md-navy-2)"></div><div class="lbl">Navy step</div><div class="hex">--md-navy-2<br>#17394F</div></div>
<div><div class="sw" style="background:var(--md-navy-ink)"></div><div class="lbl">Ink on navy</div><div class="hex">--md-navy-ink<br>#B9C7D4</div></div>
<div><div class="sw" style="background:var(--md-navy-ink-dim)"></div><div class="lbl">Ink dim</div><div class="hex">--md-navy-ink-dim<br>#7F92A3</div></div>
<div><div class="sw" style="background:var(--md-navy-ink-bright)"></div><div class="lbl">Ink bright</div><div class="hex">--md-navy-ink-bright<br>#E6EEF5</div></div>
</div><div class="hex" style="margin-top:14px">One navy section per page. Accent on navy is --md-blue-light, never --md-blue.</div></body></html>
